<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Archivo+Black&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; font-family: 'Plus Jakarta Sans', sans-serif; background: #FFF4E0; color: #16130C; overflow: hidden; }
  .c-wrap { width: 1080px; height: 1350px; display: flex; flex-direction: column; position: relative; overflow: hidden;
    background: #FFF4E0; }
  /* playful blobs */
  .blob { position: absolute; z-index: 0; }
  .b1 { width: 640px; height: 640px; right: -180px; top: -160px; background: #FFE1B8; border-radius: 46% 54% 55% 45%/48% 44% 56% 52%; transform: rotate(12deg); }
  .b2 { width: 520px; height: 520px; left: -160px; bottom: -140px; background: #D8EBFF; border-radius: 55% 45% 44% 56%/52% 55% 45% 48%; transform: rotate(-8deg); }
  .dots { position: absolute; z-index: 0; font-size: 34px; letter-spacing: 10px; color: #16130C; opacity: .18; }

  .c-top { display: flex; align-items: center; justify-content: space-between; padding: 44px 56px 0 56px; z-index: 2; }
  .logo-pill { display: flex; align-items: center; gap: 12px; background: #fff; border: 3px solid #16130C; border-radius: 999px; padding: 10px 22px 10px 12px; box-shadow: 5px 5px 0 #16130C; transform: rotate(-1.5deg); }
  .logo-pill img { width: 52px; height: 52px; }
  .logo-pill span { font-size: 30px; font-weight: 800; color: #0469DC; letter-spacing: -0.5px; }
  .c-count { font-family: 'Caveat', cursive; font-size: 44px; font-weight: 700; color: #16130C; transform: rotate(3deg); background: #FFC531; border: 3px solid #16130C; border-radius: 18px; padding: 2px 20px; box-shadow: 4px 4px 0 #16130C; }

  .c-main { flex: 1; z-index: 2; padding: 26px 56px 0 56px; display: flex; flex-direction: column; min-height: 0; }
  .c-kicker { align-self: flex-start; font-size: 24px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; background: #FF6B4A; color: #fff; padding: 12px 24px; border: 3px solid #16130C; border-radius: 16px; box-shadow: 4px 4px 0 #16130C; transform: rotate(-2deg); margin-bottom: 18px; margin-left: 6px; }
  .c-kicker:empty { display: none; }
  .c-title { font-family: 'Archivo Black', 'Plus Jakarta Sans', sans-serif; font-size: 76px; line-height: 1.02; letter-spacing: -1px; color: #16130C; max-width: 940px; }
  .c-title .hl { background: #FFC531; padding: 6px 24px 12px; border: 3px solid #16130C; border-radius: 14px; display: inline-block; transform: rotate(-1deg); box-shadow: 4px 4px 0 #16130C; }
  .c-title .u { text-decoration: underline wavy #0469DC 7px; text-underline-offset: 10px; }
  .c-title .coral { color: #FF6B4A; }
  .c-body { font-size: 30px; line-height: 1.45; font-weight: 500; color: #4A4436; margin-top: 16px; max-width: 880px; }
  .c-body:empty { display: none; }

  .c-mid { display: flex; gap: 30px; margin-top: 26px; align-items: stretch; flex: 1; min-height: 0; }
  .c-photo { position: relative; flex: 1.25; border: 4px solid #16130C; border-radius: 30px; overflow: hidden; box-shadow: 8px 8px 0 #16130C; min-width: 0; max-height: 640px; background: #fff; }
  .c-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .c-photo::before, .c-photo::after { content: ''; position: absolute; width: 150px; height: 44px; background: rgba(255,197,49,.85); border: 2px solid rgba(22,19,12,.25); z-index: 3; }
  .c-photo::before { top: -18px; left: 40px; transform: rotate(-8deg); }
  .c-photo::after { top: -18px; right: 40px; transform: rotate(7deg); background: rgba(125,211,252,.85); }
  .c-cap { position: absolute; left: 18px; bottom: 14px; z-index: 3; font-family: 'Caveat', cursive; font-size: 34px; font-weight: 700; color: #16130C; background: #fff; border: 3px solid #16130C; border-radius: 14px; padding: 2px 16px; transform: rotate(-1.5deg); box-shadow: 3px 3px 0 #16130C; }
  .c-cap:empty { display: none; }

  .c-side { flex: .85; display: flex; flex-direction: column; justify-content: flex-start; gap: 14px; min-width: 0; padding-top: 6px; }
  .c-badge { width: 118px; height: 118px; border-radius: 50%; background: #0469DC; color: #fff; font-family: 'Archivo Black', sans-serif; font-size: 62px; display: flex; align-items: center; justify-content: center; border: 4px solid #16130C; box-shadow: 5px 5px 0 #16130C; transform: rotate(-6deg); }
  .c-badge:empty { display: none; }
  .c-badge.ok { background: #22C55E; font-size: 58px; transform: rotate(6deg); }
  .c-sticker { align-self: flex-start; font-family: 'Caveat', cursive; font-size: 40px; font-weight: 700; background: #fff; border: 3px solid #16130C; border-radius: 999px; padding: 4px 24px; transform: rotate(2deg); box-shadow: 4px 4px 0 #16130C; }
  .c-sticker:empty { display: none; }
  .c-note { font-size: 26px; line-height: 1.5; font-weight: 600; color: #16130C; background: #fff; border: 3px dashed #16130C; border-radius: 20px; padding: 16px 20px; transform: rotate(-.5deg); }
  .c-note:empty { display: none; }
  .c-cta { margin-top: auto; background: #16130C; color: #fff; border-radius: 22px; padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; border: 3px solid #16130C; box-shadow: 6px 6px 0 #FF6B4A; transform: rotate(-.5deg); }
  .c-cta strong { font-size: 29px; font-weight: 800; }
  .c-cta span { font-size: 24px; font-weight: 700; color: #FFC531; }
  .c-cta:empty { display: none; }

  .c-foot { padding: 22px 56px 46px 56px; z-index: 2; }
  .c-swipe { font-family: 'Caveat', cursive; font-size: 40px; font-weight: 700; color: #16130C; transform: rotate(-1deg); margin-bottom: 10px; }
  .c-swipe:empty { display: none; }
  .c-track { height: 22px; border-radius: 999px; background: #fff; border: 3px solid #16130C; overflow: hidden; box-shadow: 4px 4px 0 #16130C; }
  .c-fill { height: 100%; background: repeating-linear-gradient(-45deg, #0469DC 0 16px, #38BDF8 16px 32px); width: __PROGRESS__; }

  /* ===== variants: break symmetry ===== */
  .v-cover .c-title { font-size: 88px; transform: rotate(-.5deg); }
  .v-cover .c-photo { transform: rotate(-1.5deg); }
  .v-cover .c-kicker { background: #16130C; color: #FFC531; box-shadow: 4px 4px 0 #FF6B4A; }
  .v-cover .c-side { justify-content: center; }
  .v-cover .c-badge { display: none; }

  .v-flip .c-mid { flex-direction: row-reverse; }
  .v-flip .c-photo { transform: rotate(1.8deg); }
  .v-flip .c-kicker { transform: rotate(1.5deg); background: #0469DC; }
  .v-flip .c-title { font-size: 70px; }

  .v-tilt .c-photo { transform: rotate(-2deg); }
  .v-tilt .c-kicker { transform: rotate(-2.5deg); }
  .v-tilt .c-title { font-size: 70px; }
  .v-tilt .c-badge { transform: rotate(5deg); }

  .v-answer { background: #E9F9EF; }
  .v-answer .b1 { background: #C9F2D6; }
  .v-answer .b2 { background: #FFE1B8; }
  .v-answer .c-kicker { background: #22C55E; transform: rotate(1deg); }
  .v-answer .c-title { font-size: 72px; }
  .v-answer .c-photo { transform: rotate(1.5deg); }
</style>
</head>
<body>
<div class="c-wrap __VARIANT__">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="dots" style="top:210px;right:60px;">•••<br>•••</div>
  <div class="dots" style="bottom:230px;left:48px;">•••<br>•••</div>
  <div class="c-top">
    <div class="logo-pill"><img src="../html/fastlis-logo.png"><span>FASTLIS</span></div>
    <div class="c-count">__NUM__</div>
  </div>
  <div class="c-main">
    <div class="c-kicker">__KICKER__</div>
    <div class="c-title">__TITLE__</div>
    <div class="c-body">__BODY__</div>
    <div class="c-mid">
      <div class="c-photo"><img src="__PHOTO__"><div class="c-cap">__CAPTION__</div></div>
      <div class="c-side">
        <div class="c-badge __BADGECLASS__">__BADGE__</div>
        <div class="c-sticker">__STICKER__</div>
        <div class="c-note">__NOTE__</div>
        <div class="c-cta">__CTA__</div>
      </div>
    </div>
  </div>
  <div class="c-foot">
    <div class="c-swipe">__SWIPE__</div>
    <div class="c-track"><div class="c-fill"></div></div>
  </div>
</div>
</body>
</html>
