<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600;1,700;1,800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; font-family: 'Plus Jakarta Sans', sans-serif; background: #DCEAFA; color: #0B2B4F; overflow: hidden; }
  .c-wrap { width: 1080px; height: 1350px; display: flex; flex-direction: column; position: relative; overflow: hidden;
    background: linear-gradient(160deg, #F2F8FF 0%, #E2EFFE 45%, #D3E6FB 100%); }
  /* soft blobs */
  .blob { position: absolute; z-index: 0; filter: blur(2px); }
  .b1 { width: 620px; height: 620px; right: -170px; top: -150px; background: #BFE0FF; border-radius: 46% 54% 55% 45%/48% 44% 56% 52%; opacity: .7; }
  .b2 { width: 520px; height: 520px; left: -160px; bottom: -140px; background: #B9E9EF; border-radius: 55% 45% 44% 56%/52% 55% 45% 48%; opacity: .65; }
  .b3 { width: 300px; height: 300px; right: 90px; bottom: 260px; background: #D6CFFB; border-radius: 50%; opacity: .45; }
  .dots { position: absolute; z-index: 0; font-size: 30px; letter-spacing: 10px; color: #0469DC; opacity: .22; }

  .c-top { display: flex; align-items: center; justify-content: space-between; padding: 44px 56px 0 56px; z-index: 2; }
  .logo-pill { display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 999px; padding: 10px 24px 10px 12px;
    border: 3px solid rgba(255,255,255,.95);
    box-shadow: 8px 8px 20px rgba(4,105,220,.18), -6px -6px 14px rgba(255,255,255,.95), inset 2px 2px 5px #fff, inset -3px -3px 8px rgba(4,105,220,.10); }
  .logo-pill img { width: 52px; height: 52px; border-radius: 50%; }
  .logo-pill span { font-size: 30px; font-weight: 800; color: #0469DC; letter-spacing: -0.5px; }
  .c-count { font-family: 'Plus Jakarta Sans', sans-serif; font-style: italic; font-size: 42px; font-weight: 800; color: #0B2B4F; background: #CFF3F7;
    border: 3px solid rgba(255,255,255,.9); border-radius: 22px; padding: 4px 22px;
    box-shadow: 7px 7px 16px rgba(4,105,220,.20), -5px -5px 12px rgba(255,255,255,.9), inset 2px 2px 5px rgba(255,255,255,.9), inset -3px -3px 7px rgba(10,192,205,.25); }

  .c-main { flex: 1; z-index: 2; padding: 24px 56px 0 56px; display: flex; flex-direction: column; min-height: 0; }
  .c-kicker { align-self: flex-start; font-size: 23px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;
    background: #D8EBFF; color: #0469DC; padding: 13px 26px; border-radius: 18px;
    border: 3px solid rgba(255,255,255,.9);
    box-shadow: 6px 6px 14px rgba(4,105,220,.20), -4px -4px 10px rgba(255,255,255,.9), inset 2px 2px 4px #fff, inset -3px -3px 6px rgba(4,105,220,.12);
    margin-bottom: 18px; margin-left: 4px; }
  .c-kicker:empty { display: none; }
  .c-title { font-weight: 800; font-size: 72px; line-height: 1.06; letter-spacing: -1.5px; color: #0B2B4F; max-width: 940px; }
  .c-title .hl { background: #FFE9A8; padding: 4px 22px 10px; border-radius: 20px; display: inline-block;
    border: 3px solid rgba(255,255,255,.9);
    box-shadow: 6px 6px 14px rgba(4,105,220,.18), -4px -4px 10px rgba(255,255,255,.9), inset 2px 2px 4px #fff; }
  .c-title .u { text-decoration: underline wavy #0AC0CD 6px; text-underline-offset: 10px; }
  .c-title .coral { color: #E85A3C; }
  .c-body { font-size: 30px; line-height: 1.45; font-weight: 500; color: #33507A; margin-top: 16px; max-width: 880px; }
  .c-body:empty { display: none; }

  .c-mid { display: flex; gap: 28px; margin-top: 26px; align-items: stretch; flex: 1; min-height: 0; }
  .c-photo { position: relative; flex: 1.25; border-radius: 36px; overflow: hidden; min-width: 0; max-height: 640px;
    background: #fff; padding: 12px;
    border: 3px solid rgba(255,255,255,.95);
    box-shadow: 12px 12px 28px rgba(4,105,220,.22), -8px -8px 20px rgba(255,255,255,.95), inset 3px 3px 8px #fff, inset -5px -5px 12px rgba(4,105,220,.10); }
  .c-photo img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 26px; }
  .c-cap { position: absolute; left: 30px; bottom: 26px; z-index: 3; font-family: 'Plus Jakarta Sans', sans-serif; font-style: italic; font-size: 30px; font-weight: 800; color: #0B2B4F; background: rgba(255,255,255,.95);
    border-radius: 16px; padding: 2px 18px;
    border: 2px solid rgba(255,255,255,1);
    box-shadow: 5px 5px 12px rgba(4,105,220,.25), inset 1px 1px 3px #fff; }
  .c-cap:empty { display: none; }

  .c-side { flex: .85; display: flex; flex-direction: column; justify-content: flex-start; gap: 16px; min-width: 0; padding-top: 4px; }
  .c-badge { width: 116px; height: 116px; border-radius: 50%; background: linear-gradient(145deg, #2B8FFF, #0469DC); color: #fff;
    font-weight: 800; font-size: 60px; display: flex; align-items: center; justify-content: center;
    border: 4px solid rgba(255,255,255,.9);
    box-shadow: 9px 9px 20px rgba(4,105,220,.35), -6px -6px 14px rgba(255,255,255,.9), inset 4px 4px 8px rgba(255,255,255,.45), inset -5px -5px 10px rgba(0,40,90,.35); }
  .c-badge:empty { display: none; }
  .c-badge.ok { background: linear-gradient(145deg, #34D399, #0EA472); }
  .c-sticker { align-self: flex-start; font-family: 'Plus Jakarta Sans', sans-serif; font-style: italic; font-size: 31px; font-weight: 800; color: #0B2B4F; background: #fff;
    border-radius: 999px; padding: 4px 24px;
    border: 3px solid rgba(255,255,255,.95);
    box-shadow: 6px 6px 14px rgba(4,105,220,.18), -4px -4px 10px rgba(255,255,255,.9), inset 2px 2px 4px #fff; }
  .c-sticker:empty { display: none; }
  .c-note { font-size: 26px; line-height: 1.5; font-weight: 600; color: #0B2B4F; background: #F4F9FF;
    border-radius: 24px; padding: 18px 22px;
    border: 3px solid rgba(255,255,255,.9);
    box-shadow: 7px 7px 16px rgba(4,105,220,.16), -5px -5px 12px rgba(255,255,255,.9), inset 2px 2px 5px #fff, inset -3px -3px 7px rgba(4,105,220,.08); }
  .c-note:empty { display: none; }
  .c-cta { margin-top: auto; background: linear-gradient(145deg, #1E7CE8, #0469DC); color: #fff; border-radius: 26px; padding: 20px 24px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    border: 3px solid rgba(255,255,255,.55);
    box-shadow: 9px 9px 20px rgba(4,105,220,.35), -5px -5px 12px rgba(255,255,255,.8), inset 3px 3px 6px rgba(255,255,255,.4), inset -4px -4px 8px rgba(0,40,90,.3); }
  .c-cta strong { font-size: 29px; font-weight: 800; }
  .c-cta span { font-size: 24px; font-weight: 700; color: #B9E9FF; }
  .c-cta:empty { display: none; }

  .c-foot { padding: 22px 56px 46px 56px; z-index: 2; }
  .c-swipe { font-family: 'Plus Jakarta Sans', sans-serif; font-style: italic; font-size: 31px; font-weight: 800; color: #0B2B4F; margin-bottom: 10px; }
  .c-swipe:empty { display: none; }
  .c-track { height: 26px; border-radius: 999px; background: #CBDFF5; overflow: hidden;
    border: 2px solid rgba(255,255,255,.9);
    box-shadow: inset 4px 4px 8px rgba(4,105,220,.25), inset -2px -2px 5px rgba(255,255,255,.8), 4px 4px 10px rgba(255,255,255,.7); }
  .c-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #0469DC, #0AC0CD); width: __PROG__;
    box-shadow: inset 2px 2px 4px rgba(255,255,255,.55); }

  /* ===== variants ===== */
  .v-cover .c-title { font-size: 82px; }
  .v-cover .c-kicker { background: #0469DC; color: #fff; }
  .v-cover .c-side { justify-content: center; }
  .v-cover .c-badge { display: none; }

  .v-flip .c-mid { flex-direction: row-reverse; }
  .v-flip .c-title { font-size: 66px; }

  .v-tilt .c-title { font-size: 66px; }

  .v-answer { background: linear-gradient(160deg, #EDFBF3 0%, #DDF5E7 50%, #CDEEDB 100%); }
  .v-answer .b1 { background: #B9E9C9; }
  .v-answer .b2 { background: #BFE0FF; }
  .v-answer .c-kicker { background: #22C55E; color: #fff; }
  .v-answer .c-title { font-size: 68px; }
</style>
</head>
<body>
<div class="c-wrap __VARIANT__">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="dots" style="top:210px;right:60px;">•••<br>•••</div>
  <div class="dots" style="bottom:230px;left:48px;">•••<br>•••</div>
  <div class="c-top">
    <div class="logo-pill"><img src="../html/fastlis-logo.png"><span>FASTLIS</span></div>
    <div class="c-count">__NUM__</div>
  </div>
  <div class="c-main">
    <div class="c-kicker">__KICKER__</div>
    <div class="c-title">__TITLE__</div>
    <div class="c-body">__BODY__</div>
    <div class="c-mid">
      <div class="c-photo"><img src="__PHOTO__"><div class="c-cap">__CAPTION__</div></div>
      <div class="c-side">
        <div class="c-badge __BADGECLASS__">__BADGE__</div>
        <div class="c-sticker">__STICKER__</div>
        <div class="c-note">__NOTE__</div>
        <div class="c-cta">__CTA__</div>
      </div>
    </div>
  </div>
  <div class="c-foot">
    <div class="c-swipe">__SWIPE__</div>
    <div class="c-track"><div class="c-fill"></div></div>
  </div>
</div>
</body>
</html>
