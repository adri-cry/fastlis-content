<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Archivo+Black&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; font-family: 'Plus Jakarta Sans', sans-serif; background: #FFF4E0; color: #16130C; overflow: hidden; }
  .b-wrap { width: 1080px; height: 1350px; display: flex; flex-direction: column; position: relative; overflow: hidden; background: #FFF4E0; }
  .blob { position: absolute; z-index: 0; }
  .b1 { width: 640px; height: 640px; right: -180px; top: -160px; background: #FFE1B8; border-radius: 46% 54% 55% 45%/48% 44% 56% 52%; transform: rotate(12deg); }
  .b2 { width: 520px; height: 520px; left: -160px; bottom: -140px; background: #D8EBFF; border-radius: 55% 45% 44% 56%/52% 55% 45% 48%; transform: rotate(-8deg); }
  .dots { position: absolute; z-index: 0; font-size: 34px; letter-spacing: 10px; color: #16130C; opacity: .18; }
  .s-top { display: flex; align-items: center; justify-content: space-between; padding: 44px 56px 0 56px; z-index: 2; }
  .logo-pill { display: flex; align-items: center; gap: 12px; background: #fff; border: 3px solid #16130C; border-radius: 999px; padding: 10px 22px 10px 12px; box-shadow: 5px 5px 0 #16130C; transform: rotate(-1.5deg); }
  .logo-pill img { width: 52px; height: 52px; }
  .logo-pill span { font-size: 30px; font-weight: 800; color: #0469DC; letter-spacing: -0.5px; }
  .s-kicker { align-self: flex-start; font-size: 24px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; background: #16130C; color: #FFC531; padding: 12px 24px; border: 3px solid #16130C; border-radius: 16px; box-shadow: 4px 4px 0 #FF6B4A; transform: rotate(-1.5deg); margin-bottom: 10px; }
  .s-kicker:empty { display: none; }
  .s-body { flex: 1; z-index: 2; padding: 20px 56px 0 56px; display: flex; flex-direction: column; min-height: 0; justify-content: center; }
  .s-title { font-family: 'Archivo Black', 'Plus Jakarta Sans', sans-serif; font-size: 82px; line-height: 1.02; letter-spacing: -1px; color: #16130C; }
  .s-title .hl { background: #FFC531; padding: 6px 24px 12px; border: 3px solid #16130C; border-radius: 14px; display: inline-block; transform: rotate(-1deg); box-shadow: 4px 4px 0 #16130C; }
  .s-sub { font-size: 30px; line-height: 1.45; font-weight: 500; color: #4A4436; margin-top: 18px; max-width: 880px; }
  .s-note { align-self: flex-start; font-size: 26px; font-weight: 700; color: #16130C; background: #fff; border: 3px dashed #16130C; border-radius: 20px; padding: 14px 20px; margin-top: 16px; transform: rotate(-.5deg); }
  .s-note:empty { display: none; }
  .s-mid { margin-top: 24px; display: flex; gap: 24px; align-items: stretch; }
  .s-photo { position: relative; flex: 1.1; border: 4px solid #16130C; border-radius: 30px; overflow: hidden; box-shadow: 8px 8px 0 #16130C; min-height: 520px; max-height: 620px; background: #fff; transform: rotate(-1deg); }
  .s-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .s-photo::before, .s-photo::after { content: ''; position: absolute; width: 150px; height: 44px; border: 2px solid rgba(22,19,12,.25); z-index: 3; }
  .s-photo::before { top: -18px; left: 40px; background: rgba(255,197,49,.85); transform: rotate(-8deg); }
  .s-photo::after { top: -18px; right: 40px; background: rgba(125,211,252,.85); transform: rotate(7deg); }
  .s-cap { position: absolute; left: 18px; bottom: 14px; z-index: 3; font-family: 'Caveat', cursive; font-size: 34px; font-weight: 700; color: #16130C; background: #fff; border: 3px solid #16130C; border-radius: 14px; padding: 2px 16px; transform: rotate(-1.5deg); box-shadow: 3px 3px 0 #16130C; }
  .s-cap:empty { display: none; }
  .s-side { flex: .9; display: flex; flex-direction: column; gap: 14px; justify-content: center; }
  .s-sticker { align-self: flex-start; font-family: 'Caveat', cursive; font-size: 40px; font-weight: 700; background: #fff; border: 3px solid #16130C; border-radius: 999px; padding: 4px 24px; transform: rotate(2deg); box-shadow: 4px 4px 0 #16130C; }
  .s-sticker:empty { display: none; }
  .s-cta { margin-top: 8px; background: #16130C; color: #fff; border-radius: 22px; padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; border: 3px solid #16130C; box-shadow: 6px 6px 0 #FF6B4A; transform: rotate(-.5deg); }
  .s-cta strong { font-size: 29px; font-weight: 800; }
  .s-cta span { font-size: 24px; font-weight: 700; color: #FFC531; }
  .s-cta:empty { display: none; }
  .s-foot { padding: 18px 56px 46px 56px; z-index: 2; display: flex; align-items: center; justify-content: space-between; }
  .s-meta { font-size: 26px; font-weight: 800; color: #16130C; }
  .s-meta:empty { display: none; }
  .s-dots { font-size: 34px; color: #16130C; opacity: .18; letter-spacing: 10px; }
</style>
</head>
<body>
<div class="b-wrap">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="dots" style="top:210px;right:60px;">•••<br>•••</div>
  <div class="dots" style="bottom:230px;left:48px;">•••<br>•••</div>
  <div class="s-top">
    <div class="logo-pill"><img src="../html/fastlis-logo.png"><span>FASTLIS</span></div>
    <div class="s-dots">•••</div>
  </div>
  <div class="s-body">
    <div class="s-kicker">__KICKER__</div>
    <div class="s-title">__TITLE__</div>
    <div class="s-sub">__SUB__</div>
    <div class="s-note">__NOTE__</div>
    <div class="s-mid">
      <div class="s-photo"><img src="__PHOTO__"><div class="s-cap">__CAPTION__</div></div>
      <div class="s-side">
        <div class="s-sticker">__STICKER__</div>
        <div class="s-cta">__CTA__</div>
      </div>
    </div>
  </div>
  <div class="s-foot">
    <div class="s-meta">__META__</div>
    <div class="s-dots">•••</div>
  </div>
</div>
</body>
</html>
