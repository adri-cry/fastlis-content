<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link href="../html/fonts/poppins.css" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; font-family: 'Poppins', sans-serif; background: #DCEAFA; color: #0B2B4F; overflow: hidden; }
  .b-wrap { width: 1080px; height: 1350px; display: flex; flex-direction: column; position: relative; overflow: hidden;
    background: linear-gradient(160deg, #F2F8FF 0%, #E2EFFE 45%, #D3E6FB 100%); }
  .blob { position: absolute; z-index: 0; filter: blur(2px); }
  .b1 { width: 620px; height: 620px; right: -170px; top: -150px; background: #BFE0FF; border-radius: 46% 54% 55% 45%/48% 44% 56% 52%; opacity: .7; }
  .b2 { width: 520px; height: 520px; left: -160px; bottom: -140px; background: #B9E9EF; border-radius: 55% 45% 44% 56%/52% 55% 45% 48%; opacity: .65; }
  .dots { position: absolute; z-index: 0; font-size: 30px; letter-spacing: 10px; color: #0469DC; opacity: .22; }
  .s-top { display: flex; align-items: center; justify-content: space-between; padding: 44px 56px 0 56px; z-index: 2; }
  .logo-pill { display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 999px; padding: 10px 24px 10px 12px;
    border: 3px solid rgba(255,255,255,.95);
    box-shadow: 8px 8px 20px rgba(4,105,220,.18), -6px -6px 14px rgba(255,255,255,.95), inset 2px 2px 5px #fff, inset -3px -3px 8px rgba(4,105,220,.10); }
  .logo-pill img { width: 52px; height: 52px; border-radius: 50%; }
  .logo-pill span { font-size: 30px; font-weight: 800; color: #0469DC; letter-spacing: -0.5px; }
  .s-kicker { align-self: flex-start; font-size: 23px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;
    background: #0469DC; color: #fff; padding: 13px 26px; border-radius: 18px;
    border: 3px solid rgba(255,255,255,.55);
    box-shadow: 6px 6px 14px rgba(4,105,220,.30), -4px -4px 10px rgba(255,255,255,.9), inset 2px 2px 4px rgba(255,255,255,.45), inset -3px -3px 6px rgba(0,40,90,.3);
    margin-bottom: 10px; }
  .s-kicker:empty { display: none; }
  .s-body { flex: 1; z-index: 2; padding: 20px 56px 0 56px; display: flex; flex-direction: column; min-height: 0; justify-content: center; }
  .s-title { font-weight: 800; font-size: 78px; line-height: 1.06; letter-spacing: -1.5px; color: #0B2B4F; }
  .s-title .hl { background: #FFE9A8; padding: 4px 22px 10px; border-radius: 20px; display: inline-block;
    border: 3px solid rgba(255,255,255,.9);
    box-shadow: 6px 6px 14px rgba(4,105,220,.18), -4px -4px 10px rgba(255,255,255,.9), inset 2px 2px 4px #fff; }
  .s-sub { font-size: 30px; line-height: 1.45; font-weight: 500; color: #33507A; margin-top: 18px; max-width: 880px; }
  .s-note { align-self: flex-start; font-size: 26px; font-weight: 700; color: #0B2B4F; background: #F4F9FF;
    border-radius: 24px; padding: 14px 22px; margin-top: 16px;
    border: 3px solid rgba(255,255,255,.9);
    box-shadow: 7px 7px 16px rgba(4,105,220,.16), -5px -5px 12px rgba(255,255,255,.9), inset 2px 2px 5px #fff; }
  .s-note:empty { display: none; }
  .s-mid { margin-top: 24px; display: flex; gap: 26px; align-items: stretch; }
  .s-photo { position: relative; flex: 1.1; border-radius: 36px; overflow: hidden; min-height: 520px; max-height: 620px;
    background: #fff; padding: 12px;
    border: 3px solid rgba(255,255,255,.95);
    box-shadow: 12px 12px 28px rgba(4,105,220,.22), -8px -8px 20px rgba(255,255,255,.95), inset 3px 3px 8px #fff, inset -5px -5px 12px rgba(4,105,220,.10); }
  .s-photo img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 26px; }
  .s-cap { position: absolute; left: 30px; bottom: 26px; z-index: 3; font-family: 'Poppins', sans-serif; font-style: italic; font-size: 30px; font-weight: 800; color: #0B2B4F; background: rgba(255,255,255,.95);
    border-radius: 16px; padding: 2px 18px; border: 2px solid #fff;
    box-shadow: 5px 5px 12px rgba(4,105,220,.25), inset 1px 1px 3px #fff; }
  .s-cap:empty { display: none; }
  .s-side { flex: .9; display: flex; flex-direction: column; gap: 16px; justify-content: center; }
  .s-sticker { align-self: flex-start; font-family: 'Poppins', sans-serif; font-style: italic; font-size: 31px; font-weight: 800; color: #0B2B4F; background: #fff;
    border-radius: 999px; padding: 4px 24px;
    border: 3px solid rgba(255,255,255,.95);
    box-shadow: 6px 6px 14px rgba(4,105,220,.18), -4px -4px 10px rgba(255,255,255,.9), inset 2px 2px 4px #fff; }
  .s-sticker:empty { display: none; }
  .s-cta { margin-top: 8px; background: linear-gradient(145deg, #1E7CE8, #0469DC); color: #fff; border-radius: 26px; padding: 20px 24px; display: flex; align-items: center; justify-content: space-between;
    border: 3px solid rgba(255,255,255,.55);
    box-shadow: 9px 9px 20px rgba(4,105,220,.35), -5px -5px 12px rgba(255,255,255,.8), inset 3px 3px 6px rgba(255,255,255,.4), inset -4px -4px 8px rgba(0,40,90,.3); }
  .s-cta strong { font-size: 29px; font-weight: 800; }
  .s-cta span { font-size: 24px; font-weight: 700; color: #B9E9FF; }
  .s-cta:empty { display: none; }
  .s-foot { padding: 18px 56px 46px 56px; z-index: 2; display: flex; align-items: center; justify-content: space-between; }
  .s-meta { font-size: 26px; font-weight: 800; color: #0B2B4F; background: #fff; border-radius: 999px; padding: 8px 22px;
    border: 2px solid rgba(255,255,255,.95);
    box-shadow: 5px 5px 12px rgba(4,105,220,.18), -3px -3px 8px rgba(255,255,255,.9), inset 1px 1px 3px #fff; }
  .s-meta:empty { display: none; }
  .s-dots { font-size: 30px; color: #0469DC; opacity: .25; letter-spacing: 10px; }
</style>
</head>
<body>
<div class="b-wrap">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="dots" style="top:210px;right:60px;">•••<br>•••</div>
  <div class="dots" style="bottom:230px;left:48px;">•••<br>•••</div>
  <div class="s-top">
    <div class="logo-pill"><img src="../html/fastlis-logo.png"><span>FASTLIS</span></div>
    <div class="s-dots">•••</div>
  </div>
  <div class="s-body">
    <div class="s-kicker">__KICKER__</div>
    <div class="s-title">__TITLE__</div>
    <div class="s-sub">__SUB__</div>
    <div class="s-note">__NOTE__</div>
    <div class="s-mid">
      <div class="s-photo"><img src="__PHOTO__"><div class="s-cap">__CAPTION__</div></div>
      <div class="s-side">
        <div class="s-sticker">__STICKER__</div>
        <div class="s-cta">__CTA__</div>
      </div>
    </div>
  </div>
  <div class="s-foot">
    <div class="s-meta">__META__</div>
    <div class="s-dots">•••</div>
  </div>
</div>
</body>
</html>
