<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; font-family: 'Plus Jakarta Sans', sans-serif; background: #FBFCFD; color: #0B1019; overflow: hidden; position: relative; display: flex; flex-direction: column; }
  .topbar { height: 14px; background: #0469DC; flex-shrink: 0; }
  .header { display: flex; align-items: center; gap: 20px; padding: 40px 80px 0 80px; flex-shrink: 0; }
  .header img { width: 88px; height: 88px; }
  .header .wm { font-size: 46px; font-weight: 800; color: #0469DC; letter-spacing: -1px; }
  .header .sub { font-size: 28px; color: #64748B; font-weight: 500; }
  .eyebrow { display: inline-block; font-size: 30px; font-weight: 700; letter-spacing: 4px; color: #0469DC; background: #E1FAFE; padding: 14px 30px; border-radius: 999px; text-transform: uppercase; }
  .blob { position: absolute; border-radius: 50%; z-index: 0; }
  .slide-body { flex: 1; display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 1; }
</style>
</head>
<body>
<div class="topbar"></div>
<div class="header">
  <img src="fastlis-logo.png" alt="FASTLIS">
  <div><div class="wm">FASTLIS</div><div class="sub">Laboratory Information System</div></div>
</div>

<!-- __BODY__ -->
</body>
</html>
